<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Recipes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .auth-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }

        .auth-section input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .search-filter {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-filter input, .search-filter select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .recipe-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .recipe-content {
            padding: 20px;
        }

        .recipe-title {
            font-size: 1.3em;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .recipe-category {
            display: inline-block;
            padding: 5px 12px;
            background: #e6fffa;
            color: #319795;
            border-radius: 15px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .recipe-author {
            color: #718096;
            font-size: 0.9em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 800px;
            margin: 50px auto;
            border-radius: 15px;
            padding: 30px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #718096;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2d3748;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            color: #2d3748;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍳 Family Recipe Collection</h1>
            <div id="loggedOutSection" class="auth-section">
                <input type="text" id="loginUsername" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Password">
                <button class="btn btn-primary" onclick="login()">Login</button>
            </div>
            <div id="loggedInSection" class="auth-section hidden">
                <div class="user-info">
                    <span>Welcome, <span class="user-name" id="currentUser"></span>!</span>
                    <button class="btn btn-success" onclick="openAddRecipeModal()">+ Add Recipe</button>
                    <button class="btn btn-danger" onclick="logout()">Logout</button>
                </div>
            </div>
        </header>

        <div class="search-filter">
            <input type="text" id="searchInput" placeholder="🔍 Search recipes..." oninput="filterRecipes()">
            <select id="categoryFilter" onchange="filterRecipes()">
                <option value="">All Categories</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Dessert">Dessert</option>
                <option value="Snacks">Snacks</option>
                <option value="Beverages">Beverages</option>
            </select>
        </div>

        <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <!-- Add Recipe Modal -->
    <div id="addRecipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddRecipeModal()">&times;</span>
            <h2>Add New Recipe</h2>
            <form id="recipeForm" onsubmit="submitRecipe(event)">
                <div class="form-group">
                    <label>Recipe Name *</label>
                    <input type="text" id="recipeName" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="recipeCategory" required>
                        <option value="">Select Category</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Beverages">Beverages</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ingredients *</label>
                    <textarea id="recipeIngredients" placeholder="List ingredients, one per line" required></textarea>
                </div>
                <div class="form-group">
                    <label>Instructions *</label>
                    <textarea id="recipeInstructions" placeholder="Enter cooking instructions" required></textarea>
                </div>
                <div class="form-group">
                    <label>Recipe Photo</label>
                    <input type="file" id="recipePhoto" accept="image/*" onchange="previewImage(event)">
                    <div id="imagePreview" style="margin-top: 10px;"></div>
                </div>
                <button type="submit" class="btn btn-primary">Submit Recipe</button>
            </form>
        </div>
    </div>

    <!-- View Recipe Modal -->
    <div id="viewRecipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeViewRecipeModal()">&times;</span>
            <div id="recipeDetails"></div>
        </div>
    </div>

    <script>
        // Mock data storage (in production, this connects to Azure SQL via API)
        let recipes = [
            {
                id: 1,
                name: "Grandma's Chocolate Chip Cookies",
                category: "Dessert",
                ingredients: "2 cups flour\n1 cup butter\n1 cup sugar\n2 eggs\n2 cups chocolate chips",
                instructions: "1. Preheat oven to 350°F\n2. Mix butter and sugar\n3. Add eggs\n4. Fold in flour and chips\n5. Bake for 12 minutes",
                photo: "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=400",
                author: "Mom",
                date: "2024-10-01"
            },
            {
                id: 2,
                name: "Dad's Famous Spaghetti",
                category: "Dinner",
                ingredients: "1 lb spaghetti\n2 lbs ground beef\n2 cans tomato sauce\n1 onion\nGarlic\nItalian seasoning",
                instructions: "1. Brown ground beef with onions\n2. Add garlic and sauce\n3. Simmer for 30 minutes\n4. Cook pasta\n5. Serve with parmesan",
                photo: "https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=400",
                author: "Dad",
                date: "2024-09-15"
            }
        ];

        let currentUserName = null;
        let allRecipes = [...recipes];

        // Demo login (in production, authenticate against database)
        function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if (username && password) {
                currentUserName = username;
                document.getElementById('currentUser').textContent = username;
                document.getElementById('loggedOutSection').classList.add('hidden');
                document.getElementById('loggedInSection').classList.remove('hidden');
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
            } else {
                alert('Please enter username and password');
            }
        }

        function logout() {
            currentUserName = null;
            document.getElementById('loggedOutSection').classList.remove('hidden');
            document.getElementById('loggedInSection').classList.add('hidden');
        }

        function openAddRecipeModal() {
            if (!currentUserName) {
                alert('Please login to add recipes');
                return;
            }
            document.getElementById('addRecipeModal').style.display = 'block';
        }

        function closeAddRecipeModal() {
            document.getElementById('addRecipeModal').style.display = 'none';
            document.getElementById('recipeForm').reset();
            document.getElementById('imagePreview').innerHTML = '';
        }

        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; max-height: 200px; border-radius: 8px;">`;
                }
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        }

        function submitRecipe(event) {
            event.preventDefault();
            
            const photoFile = document.getElementById('recipePhoto').files[0];
            let photoDataURL = 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=400';
            
            if (photoFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoDataURL = e.target.result;
                    saveRecipe(photoDataURL);
                }
                reader.readAsDataURL(photoFile);
            } else {
                saveRecipe(photoDataURL);
            }
        }

        function saveRecipe(photoURL) {
            const newRecipe = {
                id: recipes.length + 1,
                name: document.getElementById('recipeName').value,
                category: document.getElementById('recipeCategory').value,
                ingredients: document.getElementById('recipeIngredients').value,
                instructions: document.getElementById('recipeInstructions').value,
                photo: photoURL,
                author: currentUserName,
                date: new Date().toISOString().split('T')[0]
            };

            recipes.push(newRecipe);
            allRecipes = [...recipes];
            closeAddRecipeModal();
            filterRecipes();
            alert('Recipe added successfully!');
        }

        function filterRecipes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            const filtered = recipes.filter(recipe => {
                const matchesSearch = recipe.name.toLowerCase().includes(searchTerm) ||
                                    recipe.ingredients.toLowerCase().includes(searchTerm) ||
                                    recipe.author.toLowerCase().includes(searchTerm);
                const matchesCategory = !category || recipe.category === category;
                return matchesSearch && matchesCategory;
            });

            displayRecipes(filtered);
        }

        function displayRecipes(recipesToShow) {
            const grid = document.getElementById('recipeGrid');
            grid.innerHTML = recipesToShow.map(recipe => `
                <div class="recipe-card" onclick="viewRecipe(${recipe.id})">
                    <img src="${recipe.photo}" alt="${recipe.name}" class="recipe-image">
                    <div class="recipe-content">
                        <h3 class="recipe-title">${recipe.name}</h3>
                        <span class="recipe-category">${recipe.category}</span>
                        <p class="recipe-author">By ${recipe.author} • ${recipe.date}</p>
                    </div>
                </div>
            `).join('');
        }

        function viewRecipe(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            document.getElementById('recipeDetails').innerHTML = `
                <img src="${recipe.photo}" alt="${recipe.name}" style="width: 100%; border-radius: 10px; margin-bottom: 20px;">
                <h2>${recipe.name}</h2>
                <span class="recipe-category">${recipe.category}</span>
                <p class="recipe-author">By ${recipe.author} • ${recipe.date}</p>
                <h3 style="margin-top: 20px;">Ingredients</h3>
                <p style="white-space: pre-line;">${recipe.ingredients}</p>
                <h3 style="margin-top: 20px;">Instructions</h3>
                <p style="white-space: pre-line;">${recipe.instructions}</p>
            `;
            document.getElementById('viewRecipeModal').style.display = 'block';
        }

        function closeViewRecipeModal() {
            document.getElementById('viewRecipeModal').style.display = 'none';
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        // Initial display
        displayRecipes(recipes);
    </script>
</body>
</html>
