<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Recipes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .auth-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

            .auth-section input {
                padding: 10px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
                min-width: 150px;
            }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .btn-primary {
            background: #667eea;
            color: white;
        }

            .btn-primary:hover:not(:disabled) {
                background: #5568d3;
                transform: translateY(-2px);
            }

        .btn-success {
            background: #48bb78;
            color: white;
        }

            .btn-success:hover:not(:disabled) {
                background: #38a169;
                transform: translateY(-2px);
            }

        .btn-danger {
            background: #f56565;
            color: white;
        }

            .btn-danger:hover {
                background: #e53e3e;
            }

        .search-filter {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

            .search-filter input, .search-filter select {
                padding: 12px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
                width: 100%;
                margin-bottom: 10px;
            }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .recipe-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

            .recipe-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .recipe-content {
            padding: 20px;
        }

        .recipe-title {
            font-size: 1.3em;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .recipe-category {
            display: inline-block;
            padding: 5px 12px;
            background: #e6fffa;
            color: #319795;
            border-radius: 15px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .recipe-author {
            color: #718096;
            font-size: 0.9em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 800px;
            margin: 50px auto;
            border-radius: 15px;
            padding: 30px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #718096;
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: 600;
                color: #2d3748;
            }

            .form-group input, .form-group select, .form-group textarea {
                width: 100%;
                padding: 12px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
                font-family: inherit;
            }

            .form-group textarea {
                min-height: 150px;
                resize: vertical;
            }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            color: #2d3748;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c53030;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #22543d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

            .empty-state h2 {
                color: #2d3748;
                margin-bottom: 10px;
            }

            .empty-state p {
                color: #718096;
            }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .auth-section {
                flex-direction: column;
                align-items: stretch;
            }

                .auth-section input, .auth-section .btn {
                    width: 100%;
                }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍳 Family Recipe Collection</h1>
            <div id="messageContainer"></div>
            <div id="loggedOutSection" class="auth-section">
                <input type="text" id="loginUsername" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Password">
                <button class="btn btn-primary" onclick="login()">Login</button>
                <button class="btn btn-success" onclick="openSignupModal()">Sign Up</button>
            </div>
            <div id="loggedInSection" class="auth-section hidden">
                <div class="user-info">
                    <span>Welcome, <span class="user-name" id="currentUser"></span>!</span>
                    <button class="btn btn-success" onclick="openAddRecipeModal()">+ Add Recipe</button>
                    <button class="btn btn-danger" onclick="logout()">Logout</button>
                </div>
            </div>
        </header>

        <div class="search-filter">
            <input type="text" id="searchInput" placeholder="🔍 Search recipes..." oninput="filterRecipes()">
            <select id="categoryFilter" onchange="filterRecipes()">
                <option value="">All Categories</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Dessert">Dessert</option>
                <option value="Snacks">Snacks</option>
                <option value="Beverages">Beverages</option>
            </select>
        </div>

        <div id="loadingIndicator" class="loading hidden">Loading recipes...</div>
        <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <!-- Add Recipe Modal -->
    <div id="addRecipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddRecipeModal()">&times;</span>
            <h2>Add New Recipe</h2>
            <form id="recipeForm" onsubmit="submitRecipe(event)">
                <div class="form-group">
                    <label>Recipe Name *</label>
                    <input type="text" id="recipeName" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="recipeCategory" required>
                        <option value="">Select Category</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Beverages">Beverages</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ingredients *</label>
                    <textarea id="recipeIngredients" placeholder="List ingredients, one per line" required></textarea>
                </div>
                <div class="form-group">
                    <label>Instructions *</label>
                    <textarea id="recipeInstructions" placeholder="Enter cooking instructions" required></textarea>
                </div>
                <div class="form-group">
                    <label>Recipe Photo</label>
                    <input type="file" id="recipePhoto" accept="image/*" onchange="previewImage(event)">
                    <div id="imagePreview" style="margin-top: 10px;"></div>
                </div>
                <button type="submit" class="btn btn-primary" id="submitRecipeBtn">Submit Recipe</button>
            </form>
        </div>
    </div>

    <!-- View Recipe Modal -->
    <div id="viewRecipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeViewRecipeModal()">&times;</span>
            <div id="recipeDetails"></div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeSignupModal()">&times;</span>
            <h2>Create Account</h2>
            <p style="color: #718096; margin-bottom: 20px;">Join our family recipe collection</p>
            <form id="signupForm" onsubmit="submitSignup(event)">
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" id="signupUsername" required minlength="3" placeholder="Choose a username">
                    <small style="color: #718096;">At least 3 characters</small>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your.email@example.com (optional)">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="signupPassword" required minlength="6" placeholder="Choose a password">
                    <small style="color: #718096;">At least 6 characters</small>
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="signupConfirmPassword" required minlength="6" placeholder="Re-enter password">
                </div>
                <button type="submit" class="btn btn-primary" id="signupBtn">Create Account</button>
                <p style="margin-top: 15px; text-align: center; color: #718096;">
                    Already have an account? <a href="#" onclick="closeSignupModal(); return false;" style="color: #667eea;">Login here</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        // ===================================
        // CONFIGURATION
        // ===================================
        // IMPORTANT: Replace this with your Azure Function App URL after deployment
        const API_BASE = 'family-recipe-api-bqcthffuaahtb6a5.centralindia-01.azurewebsites.net';

        // For local development, use:
        // const API_BASE = 'http://localhost:7071/api';

        // ===================================
        // STATE MANAGEMENT
        // ===================================
        let recipes = [];
        let currentUserName = null;
        let authToken = null;

        // ===================================
        // UTILITY FUNCTIONS
        // ===================================
        function showMessage(message, type = 'error') {
            const container = document.getElementById('messageContainer');
            const className = type === 'success' ? 'success-message' : 'error-message';
            container.innerHTML = `<div class="${className}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        function showLoading(show = true) {
            document.getElementById('loadingIndicator').classList.toggle('hidden', !show);
        }

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            };
        }

        // ===================================
        // AUTHENTICATION
        // ===================================
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showMessage('Please enter username and password');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Login failed');
                }

                const data = await response.json();
                authToken = data.token;
                currentUserName = data.username;

                // Store token in session
                sessionStorage.setItem('authToken', authToken);
                sessionStorage.setItem('username', currentUserName);

                document.getElementById('currentUser').textContent = currentUserName;
                document.getElementById('loggedOutSection').classList.add('hidden');
                document.getElementById('loggedInSection').classList.remove('hidden');
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';

                showMessage('Login successful!', 'success');
                loadRecipes();
            } catch (error) {
                showMessage(error.message || 'Login failed. Please check your credentials.');
            }
        }

        function openSignupModal() {
            document.getElementById('signupModal').style.display = 'block';
        }

        function closeSignupModal() {
            document.getElementById('signupModal').style.display = 'none';
            document.getElementById('signupForm').reset();
        }

        async function submitSignup(event) {
            event.preventDefault();

            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match');
                return;
            }

            const signupBtn = document.getElementById('signupBtn');
            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating Account...';

            try {
                const response = await fetch(`${API_BASE}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Signup failed');
                }

                showMessage(data.message || 'Account created successfully!', 'success');
                closeSignupModal();

                // Auto-fill login form
                document.getElementById('loginUsername').value = username;
                document.getElementById('loginPassword').value = password;

                // Optional: Auto-login after signup
                setTimeout(() => {
                    login();
                }, 1000);

            } catch (error) {
                showMessage(error.message || 'Signup failed. Please try again.');
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        }

        function logout() {
            authToken = null;
            currentUserName = null;
            sessionStorage.removeItem('authToken');
            sessionStorage.removeItem('username');

            document.getElementById('loggedOutSection').classList.remove('hidden');
            document.getElementById('loggedInSection').classList.add('hidden');

            showMessage('Logged out successfully', 'success');
        }

        function checkExistingSession() {
            const token = sessionStorage.getItem('authToken');
            const username = sessionStorage.getItem('username');

            if (token && username) {
                authToken = token;
                currentUserName = username;
                document.getElementById('currentUser').textContent = currentUserName;
                document.getElementById('loggedOutSection').classList.add('hidden');
                document.getElementById('loggedInSection').classList.remove('hidden');
            }
        }

        // ===================================
        // RECIPE OPERATIONS
        // ===================================
        async function loadRecipes() {
            showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/recipes`);

                if (!response.ok) {
                    throw new Error('Failed to load recipes');
                }

                recipes = await response.json();
                filterRecipes();
            } catch (error) {
                showMessage('Failed to load recipes: ' + error.message);
                displayEmptyState();
            } finally {
                showLoading(false);
            }
        }

        function filterRecipes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            const filtered = recipes.filter(recipe => {
                const matchesSearch = recipe.name.toLowerCase().includes(searchTerm) ||
                    recipe.ingredients.toLowerCase().includes(searchTerm) ||
                    recipe.author.toLowerCase().includes(searchTerm);
                const matchesCategory = !category || recipe.category === category;
                return matchesSearch && matchesCategory;
            });

            displayRecipes(filtered);
        }

        function displayRecipes(recipesToShow) {
            const grid = document.getElementById('recipeGrid');
            
            if (recipesToShow.length === 0) {
                displayEmptyState();
                return;
            }

            grid.innerHTML = recipesToShow.map(recipe => {
                const date = new Date(recipe.createdAt).toLocaleDateString();
                return `
                        <div class="recipe-card" onclick="viewRecipe(${recipe.recipeID})">
                            <img src="${recipe.photoURL || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=400'}"
                                 alt="${recipe.name}"
                                 class="recipe-image"
                                 onerror="this.src='https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=400'">
                            <div class="recipe-content">
                                <h3 class="recipe-title">${recipe.name}</h3>
                                <span class="recipe-category">${recipe.category}</span>
                                <p class="recipe-author">By ${recipe.author} • ${date}</p>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        function displayEmptyState() {
            const grid = document.getElementById('recipeGrid');
            grid.innerHTML = `
                    <div class="empty-state">
                        <h2>No recipes found</h2>
                        <p>Try adjusting your search or category filter, or add a new recipe!</p>
                    </div>
                `;
        }

        function viewRecipe(id) {
            const recipe = recipes.find(r => r.recipeID === id);
            if (!recipe) return;

            const date = new Date(recipe.createdAt).toLocaleDateString();
            document.getElementById('recipeDetails').innerHTML = `
                    <img src="${recipe.photoURL || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=400'}"
                         alt="${recipe.name}"
                         style="width: 100%; border-radius: 10px; margin-bottom: 20px;"
                         onerror="this.src='https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=400'">
                    <h2>${recipe.name}</h2>
                    <span class="recipe-category">${recipe.category}</span>
                    <p class="recipe-author">By ${recipe.author} • ${date}</p>
                    <h3 style="margin-top: 20px;">Ingredients</h3>
                    <p style="white-space: pre-line;">${recipe.ingredients}</p>
                    <h3 style="margin-top: 20px;">Instructions</h3>
                    <p style="white-space: pre-line;">${recipe.instructions}</p>
                `;
            document.getElementById('viewRecipeModal').style.display = 'block';
        }

        // ===================================
        // ADD RECIPE
        // ===================================
        function openAddRecipeModal() {
            if (!authToken) {
                showMessage('Please login to add recipes');
                return;
            }
            document.getElementById('addRecipeModal').style.display = 'block';
        }

        function closeAddRecipeModal() {
            document.getElementById('addRecipeModal').style.display = 'none';
            document.getElementById('recipeForm').reset();
            document.getElementById('imagePreview').innerHTML = '';
        }

        function closeViewRecipeModal() {
            document.getElementById('viewRecipeModal').style.display = 'none';
        }

        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');

            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    showMessage('Image size should be less than 5MB');
                    event.target.value = '';
                    preview.innerHTML = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; max-height: 200px; border-radius: 8px;">`;
                }
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        }

        async function submitRecipe(event) {
            event.preventDefault();

            if (!authToken) {
                showMessage('Please login to add recipes');
                return;
            }

            const submitBtn = document.getElementById('submitRecipeBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                const photoFile = document.getElementById('recipePhoto').files[0];
                let photoBase64 = null;

                if (photoFile) {
                    photoBase64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(photoFile);
                    });
                }

                const recipeData = {
                    name: document.getElementById('recipeName').value,
                    category: document.getElementById('recipeCategory').value,
                    ingredients: document.getElementById('recipeIngredients').value,
                    instructions: document.getElementById('recipeInstructions').value,
                    photoBase64: photoBase64
                };

                const response = await fetch(`${API_BASE}/recipes`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(recipeData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to add recipe');
                }

                showMessage('Recipe added successfully!', 'success');
                closeAddRecipeModal();
                await loadRecipes();
            } catch (error) {
                showMessage('Failed to add recipe: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Recipe';
            }
        }

        // ===================================
        // EVENT LISTENERS
        // ===================================
        window.onclick = function (event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        document.getElementById('loginPassword').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                login();
            }
        });

        // ===================================
        // INITIALIZATION
        // ===================================
        document.addEventListener('DOMContentLoaded', function () {
            checkExistingSession();
            loadRecipes();
        });
    </script>
</body>
</html>
